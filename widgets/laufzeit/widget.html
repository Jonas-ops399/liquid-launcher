<!doctype html>
<!--
  Ersetzt die alte Kachel "Uptime 99,4%", die einen fest im HTML
  eingetragenen Wert zeigte. Hier wird gerechnet, nicht behauptet: die
  Laufzeit ergibt sich aus gestartetAm, das der Hauptprozess beim Start
  des Launchers merkt.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; height:100%; background:transparent; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:var(--ll-font, inherit);
         -webkit-user-select:none; user-select:none; }
  .mitte { text-align:center; }
  .val { font-size:calc(24px * var(--ll-fs, 1)); font-weight:650; color:var(--ll-text-hi, #fff); }
  .lbl { font-size:calc(12px * var(--ll-fs, 1)); color:var(--ll-text-lo, rgba(255,255,255,.55)); margin-top:2px; }
  .zus { font-size:calc(11px * var(--ll-fs, 1)); color:var(--ll-text-lo, rgba(255,255,255,.42)); margin-top:4px; }
  .lade { font-size:calc(12px * var(--ll-fs, 1)); color:var(--ll-text-lo, rgba(255,255,255,.45)); }
</style>
</head>
<body>
<div class="mitte" id="mitte"><div class="lade">…</div></div>
<script>
(function () {
  'use strict';
  var mitte = document.getElementById('mitte');
  var gestartetAm = null;
  var tick = null;

  function melde(typ, felder) {
    try { parent.postMessage(Object.assign({ quelle: 'liquid-launcher-widget', typ: typ }, felder || {}), '*'); }
    catch (e) {}
  }

  function rechnen() {
    if (typeof gestartetAm !== 'number') return;
    var sek = Math.max(0, Math.floor((Date.now() - gestartetAm) / 1000));
    var std = Math.floor(sek / 3600);
    var min = Math.floor((sek % 3600) / 60);
    var text;
    if (std > 0)      text = std + ' h ' + min + ' min';
    else if (min > 0) text = min + ' min ' + (sek % 60) + ' s';
    else              text = sek + ' s';
    mitte.innerHTML = '<div class="val">' + text + '</div><div class="lbl">Launcher läuft</div>';
  }

  function uebernehmen(d) {
    if (d && typeof d.gestartetAm === 'number') {
      gestartetAm = d.gestartetAm;
      rechnen();
      if (tick) clearInterval(tick);
      // Nur laufen, solange wirklich etwas anzuzeigen ist. Ohne gestartetAm
      // wuerde ein Intervall ohne Zweck weiterlaufen.
      tick = setInterval(rechnen, 1000);
    } else {
      mitte.innerHTML = '<div class="lade">…</div>';
    }
    if (d && typeof d.modAnzahl !== 'undefined' && d.instanzen) {
      // nichts weiter - Instanzzahl steht bewusst nicht in dieser Kachel
    }
  }

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.quelle !== 'liquid-launcher') return;
    if (d.typ === 'theme' && d.daten) {
      var st = document.documentElement.style;
      for (var k in d.daten) { if (k.indexOf('--') === 0) st.setProperty(k, d.daten[k]); }
    }
    if (d.typ === 'daten') uebernehmen(d.daten);
  });

  melde('anfrage');
})();
</script>
</body>
</html>
